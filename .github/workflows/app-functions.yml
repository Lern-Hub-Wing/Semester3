# StudySpace App – Edge Function „admin-auth“ im EIGENEN App-Projekt bereitstellen
#
# Läuft automatisch, wenn sich supabase-app/functions/** auf main ändert,
# oder manuell: Actions → „App: Edge Functions bereitstellen“ → Run workflow.
#
# Benötigte Repository-SECRETS:
#   SUPABASE_ACCESS_TOKEN      persönlicher Zugriffstoken (gilt für alle eigenen Projekte)
#   APP_SUPABASE_PROJECT_REF   Projekt-Referenz des NEUEN App-Projekts (NICHT die der bisherigen Seite)
name: 'App: Edge Functions bereitstellen'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase-app/functions/**'
      - '.github/workflows/app-functions.yml'

concurrency:
  group: app-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: admin-auth
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      APP_PROJECT_REF: ${{ secrets.APP_SUPABASE_PROJECT_REF }}
      OLD_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Secrets prüfen
        run: |
          # Erlaubt sind die reine Projekt-ID (z. B. abcdefghijklmnopqrst) oder die Projekt-URL
          norm() { printf '%s' "$1" | sed -E 's#^.*/project/##; s#^[[:space:]]*https?://##; s#\.supabase\.co.*$##; s#/.*$##' | tr -d '[:space:]'; }
          APP_REF="$(norm "$APP_PROJECT_REF")"
          OLD_REF="$(norm "$OLD_PROJECT_REF")"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$APP_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN und APP_SUPABASE_PROJECT_REF müssen als Repository-Secrets angelegt sein (docs/APP.md)."
            exit 1
          fi
          if ! printf '%s' "$APP_REF" | grep -Eq '^[a-z0-9]{20}$'; then
            echo "::error::APP_SUPABASE_PROJECT_REF ist keine gültige Projekt-ID (20 Kleinbuchstaben/Ziffern, z. B. aus https://<ID>.supabase.co)."
            exit 1
          fi
          # Schutz: niemals in das Projekt der bisherigen Seite bereitstellen
          if [ "$APP_REF" = "$OLD_REF" ]; then
            echo "::error::APP_SUPABASE_PROJECT_REF zeigt auf das Projekt der bisherigen Seite. Abbruch."
            exit 1
          fi
          echo "APP_REF=$APP_REF" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Bereitstellen
        run: |
          # Die CLI erwartet supabase/functions/<name> – eigener Arbeitsordner nur mit App-Funktionen
          mkdir -p "$RUNNER_TEMP/app/supabase/functions"
          cp -r supabase-app/functions/* "$RUNNER_TEMP/app/supabase/functions/"
          cd "$RUNNER_TEMP/app"
          # Supabase CLI 3: Zielprojekt über --remote (wie beim Push-Workflow der bisherigen Seite)
          supabase functions deploy admin-auth --remote="$APP_REF" --no-verify-jwt --yes
