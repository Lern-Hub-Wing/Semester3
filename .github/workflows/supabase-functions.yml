# StudySpace – Edge Functions für Push-Benachrichtigungen bereitstellen
#
# Manuell starten: Actions → „Supabase Edge Functions bereitstellen“ → Run workflow
# (README, Schritt 12). Damit ist keine lokale Installation der Supabase CLI nötig.
#
# Benötigte Repository-SECRETS (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN   persönlicher Zugriffstoken (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF    Projekt-Referenz, z. B. abcd1234 (aus https://abcd1234.supabase.co)
#
# Die VAPID-Schlüssel und das Scheduler-Secret werden NICHT hier, sondern im
# Supabase Dashboard als Edge-Function-Secrets hinterlegt.
name: Supabase Edge Functions bereitstellen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    name: push-api + push-scheduler
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Secrets prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN und SUPABASE_PROJECT_REF müssen als Repository-Secrets angelegt sein (README, Schritt 12)."
            exit 1
          fi
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Bereitstellen
        run: |
          supabase functions deploy push-api --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy push-scheduler --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --yes

