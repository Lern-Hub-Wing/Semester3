# StudySpace – Tests und Veröffentlichung auf GitHub Pages
#
# * Bei jedem Pull Request: Typprüfung, Unit-Tests, Datenbanktests, Browsertests.
# * Bei jedem Push auf "main" (oder manuell): zusätzlich Build + Deployment.
#
# Benötigte Repository-Variablen (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL              z. B. https://abcd1234.supabase.co
#   VITE_SUPABASE_PUBLISHABLE_KEY  der Publishable Key (sb_publishable_…) – NIEMALS den Secret Key!
#   VITE_MAX_UPLOAD_MB             optional, Standard 10
#   VITE_VAPID_PUBLIC_KEY          optional, öffentlicher VAPID-Schlüssel für Push (README, Schritt 12)
#
# Neue App unter /app/ (EIGENES Supabase-Projekt, siehe docs/APP.md):
#   VITE_APP_SUPABASE_URL              URL des App-Projekts
#   VITE_APP_SUPABASE_PUBLISHABLE_KEY  Publishable Key des App-Projekts
# Fehlen sie, zeigt /app/ einen Einrichtungshinweis – die bisherige Seite bleibt unberührt.
name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Typprüfung Edge Functions (Deno)
        # Deno kommt über die npm-Registry (zuverlässiger als ein separater Download);
        # bei Netzwerkproblemen wird bis zu dreimal neu versucht.
        run: |
          for i in 1 2 3; do
            npx --yes deno@2.5.6 check supabase/functions/push-api/index.ts supabase/functions/push-scheduler/index.ts supabase-app/functions/admin-auth/index.ts && exit 0
            echo "Versuch $i fehlgeschlagen – neuer Versuch in 10 s"; sleep 10
          done
          exit 1
      - name: Unit-Tests
        run: npm test
      - name: Datenbanktests (Migrationen, Rechte, Trigger)
        run: npm run test:db
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: App-Datenbankschema aktuell?
        run: node scripts/build-app-schema.mjs --check
      - name: App-Datenbanktests (Gruppen-Trennung, Tarife, Admin, parallele Beitritte)
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c 'create database app_test'
          npm run test:db:app
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
      - name: Browser installieren
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Browsertests (mit nachgebildeter Supabase-API)
        run: |
          npm run build:e2e
          npm run test:e2e
      - name: Browsertests der neuen App und des Admin-Bereichs
        run: |
          npm run build:e2e:app
          npm run test:e2e:app

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          # Unterpfad automatisch (z. B. /Semester3/), bei eigener Domain "/"
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_MAX_UPLOAD_MB: ${{ vars.VITE_MAX_UPLOAD_MB || '10' }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - name: Hinweis bei fehlender Konfiguration
        env:
          URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::VITE_SUPABASE_URL ist nicht gesetzt – die Seite zeigt den Einrichtungsbildschirm. Siehe README, Schritt 9."
          fi
      - name: Build der neuen App (/app/, eigenes Supabase-Projekt)
        run: npm run build:app
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/app/
          VITE_SUPABASE_URL: ${{ vars.VITE_APP_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_APP_SUPABASE_PUBLISHABLE_KEY }}
      - name: SPA-Fallback und .nojekyll
        run: |
          cp dist/index.html dist/404.html
          # Die App liegt als eigener Bereich neben der bisherigen Seite
          cp -r dist-app dist/app
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
