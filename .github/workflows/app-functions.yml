# StudySpace App – Edge Function „admin-auth“ im EIGENEN App-Projekt bereitstellen
#
# Läuft automatisch, wenn sich supabase-app/functions/** auf main ändert,
# oder manuell: Actions → „App: Edge Functions bereitstellen“ → Run workflow.
#
# Benötigte Repository-SECRETS:
#   SUPABASE_ACCESS_TOKEN      persönlicher Zugriffstoken (gilt für alle eigenen Projekte)
#   APP_SUPABASE_PROJECT_REF   Projekt-Referenz des NEUEN App-Projekts (NICHT die der bisherigen Seite)
name: 'App: Edge Functions bereitstellen'

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase-app/functions/**'
      - '.github/workflows/app-functions.yml'

concurrency:
  group: app-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: admin-auth
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      APP_PROJECT_REF: ${{ secrets.APP_SUPABASE_PROJECT_REF }}
      OLD_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Secrets prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$APP_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN und APP_SUPABASE_PROJECT_REF müssen als Repository-Secrets angelegt sein (docs/APP.md)."
            exit 1
          fi
          # Schutz: niemals in das Projekt der bisherigen Seite bereitstellen
          if [ "$APP_PROJECT_REF" = "$OLD_PROJECT_REF" ]; then
            echo "::error::APP_SUPABASE_PROJECT_REF ist identisch mit dem Projekt der bisherigen Seite. Abbruch."
            exit 1
          fi
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Bereitstellen
        run: |
          # Die CLI erwartet supabase/functions/<name> – eigener Arbeitsordner nur mit App-Funktionen
          mkdir -p "$RUNNER_TEMP/app/supabase/functions"
          cp -r supabase-app/functions/* "$RUNNER_TEMP/app/supabase/functions/"
          cd "$RUNNER_TEMP/app"
          supabase functions deploy admin-auth --project-ref "$APP_PROJECT_REF" --no-verify-jwt --yes
